<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student management System</h1>
    <input type="text" id="txtStudentId" placeholder="Enter id">
    <input type="text" id="txtStudentName" placeholder="Enter name">
    <input type="text" id="txtStudentAge" placeholder="Enter age">    
    <input type="text" id="txtStudentAddress" placeholder="Enter address">

    <hr>


    <input type="button" id="add" value="Add Student" onclick="btnAddStudentOnAction()">
    <input type="button" id="searchbyId" value="Search by Id" onclick="btnSearchByIdStudentOnAction()">
    <input type="button" id="deletebyId" value="Delete by Id" onclick="btnDeleteByIdStudentOnAction()">
    <input type="button" id="updatebyId" value="Update by Id" onclick="btnUpdateByIdStudentOnAction()">
    <input type="button" id="Clear Storage" value="Clear Storage" onclick="btnClearStorageOnAction()">
    <input type="button" id="showAll" value="Load Table" onclick="btnLoadAllStudentsOnAction()">    
    <script src="app.js"></script>
</body>
</html>
